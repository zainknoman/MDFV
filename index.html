<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF7F0;
    --canvas: #FFFFFF;
    --ink: #23211D;
    --ink-soft: #5B5648;
    --spine: #445F5A;
    --spine-dark: #324644;
    --line: #DEDACD;
    --rust: #A6462E;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 32px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 80px;
  }

  .wrap{
    max-width: 80%;
    margin: 0 auto;
  }

  /* --- Masthead --- */
  .masthead{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 36px;
  }

  .masthead h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .masthead .kicker{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* --- Intake panel (upload + paste) --- */
  .intake{
    background: var(--canvas);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 28px;
    margin-bottom: 44px;
    box-shadow: 0 1px 0 var(--line);
  }

  .field{ margin-bottom: 22px; }
  .field:last-of-type{ margin-bottom: 0; }

  .field-label{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--spine-dark);
    margin-bottom: 10px;
  }

  .field-label::before{
    content: '';
    width: 6px;
    height: 6px;
    background: var(--spine);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* file input styled as a stamped button + filename readout */
  .file-row{
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .file-btn{
    position: relative;
    display: inline-flex;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink);
    border: none;
    border-radius: 2px;
    padding: 10px 18px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.15s ease;
  }
  .file-btn:hover{ background: var(--spine-dark); }
  .file-btn input[type="file"]{
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  #fileName{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }
  #fileName.has-file{ color: var(--spine-dark); }

  textarea{
    width: 100%;
    min-height: 140px;
    resize: vertical;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 14px 16px;
  }
  textarea:focus{
    outline: none;
    border-color: var(--spine);
    box-shadow: 0 0 0 3px rgba(68,95,90,0.12);
  }
  textarea::placeholder{ color: #B4AE9C; }

  .render-btn{
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--spine-dark);
    background: transparent;
    border: 1.5px solid var(--spine-dark);
    border-radius: 2px;
    padding: 9px 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .render-btn:hover{
    background: var(--spine-dark);
    color: var(--paper);
  }

  /* --- Document output, styled as an index card / manuscript sheet --- */
  .doc-frame{
    position: relative;
    margin-top: 8px;
  }

  .doc-tab{
    position: absolute;
    top: -15px;
    left: 28px;
    background: var(--spine);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 5px 12px;
    border-radius: 2px 2px 0 0;
    z-index: 2;
  }

  .markdown-body{
    background: var(--canvas);
    border: 1px solid var(--line);
    border-top: 3px solid var(--spine);
    border-radius: 2px;
    padding: 48px;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink);
    box-shadow: 0 2px 0 var(--line), 0 14px 30px -18px rgba(35,33,29,0.25);
  }

  .markdown-body h1, .markdown-body h2, .markdown-body h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .markdown-body h1{
    font-size: 30px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
  }
  .markdown-body h2{
    font-size: 23px;
    margin-top: 2em;
  }
  .markdown-body a{ color: var(--spine-dark); }
  .markdown-body code{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85em;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1px 5px;
  }
  .markdown-body pre{
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--spine);
    border-radius: 2px;
    padding: 16px 18px;
    overflow-x: auto;
  }
  .markdown-body pre code{ border: none; padding: 0; background: none; }
  .markdown-body blockquote{
    margin: 1.4em 0;
    padding: 4px 20px;
    border-left: 3px solid var(--rust);
    color: var(--ink-soft);
    font-style: italic;
  }
  .markdown-body table{
    border-collapse: collapse;
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }
  .markdown-body th, .markdown-body td{
    border: 1px solid var(--line);
    padding: 8px 12px;
  }
  .markdown-body th{
    background: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .markdown-body img{ max-width: 100%; }
  .markdown-body hr{ border: none; border-top: 1px solid var(--line); margin: 2.2em 0; }

  @media (max-width: 640px){
    body{ padding: 32px 16px 60px; }
    .markdown-body{ padding: 28px 22px; }
    .masthead{ flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  @media (prefers-reduced-motion: reduce){
    .file-btn, .render-btn{ transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Markdown Viewer</h1>
    <span class="kicker">Read &amp; render</span>
  </div>

  <div class="intake">
    <div class="field">
      <div class="field-label">Upload file</div>
      <div class="file-row">
        <label class="file-btn">
          Choose .md file
          <input type="file" id="fileInput" accept=".md">
        </label>
        <span id="fileName">No file selected</span>
      </div>
    </div>

    <div class="field">
      <div class="field-label">Or paste markdown</div>
      <textarea id="markdownTextbox" placeholder="Paste markdown here..."></textarea>
      <button class="render-btn" id="renderBtn">Render markdown</button>
    </div>
  </div>

  <div class="doc-frame">
    <span class="doc-tab" id="docTab">untitled.md</span>
    <div class="markdown-body" id="markdown-container">
      Loading markdown…
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    const fileNameEl = document.getElementById('fileName');
    const docTabEl = document.getElementById('docTab');

    async function loadMarkdownFile(file) {
        const text = await file.text();
        document.getElementById('markdown-container').innerHTML = marked.parse(text);
        document.getElementById('markdownTextbox').value = text;
        fileNameEl.textContent = file.name;
        fileNameEl.classList.add('has-file');
        docTabEl.textContent = file.name;
    }

    document.getElementById('fileInput').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) loadMarkdownFile(file);
    });

    document.getElementById('renderBtn').addEventListener('click', () => {
        const text = document.getElementById('markdownTextbox').value;
        document.getElementById('markdown-container').innerHTML = marked.parse(text);
        docTabEl.textContent = 'pasted.md';
    });

    // Load default file if exists
    fetch('level2_game_story.md')
        .then(res => res.text())
        .then(text => {
            document.getElementById('markdown-container').innerHTML = marked.parse(text);
            document.getElementById('markdownTextbox').value = text;
            docTabEl.textContent = 'level2_game_story.md';
        })
        .catch(() => {
            docTabEl.textContent = 'untitled.md';
        });
</script>
</body>
</html>
